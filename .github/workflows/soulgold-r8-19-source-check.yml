name: SoulGold R8-19 Source-to-exact-ROM build identity audit source-only
on: [push, pull_request]
permissions:
  contents: read
jobs:
  fake-only-19:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Run isolated mock regressions
        run: |
          PYTHONPATH=review/r8/19_source_rom_identity python3 -m unittest discover -s review/r8/19_source_rom_identity -p 'test_*.py' -v
          python3 -m py_compile review/r8/19_source_rom_identity/patch19_source_rom_identity.py review/r8/19_source_rom_identity/test_patch19_source_rom_identity.py
