name: Source checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Check public boundary and C syntax
        run: |
          python3 tools/test_source_boundary.py
          python3 tools/test_build_boundary.py
          python3 tools/test_choice_protocol.py
          python3 tools/test_choice_lease.py
          python3 tools/test_copy_postloop.py
          python3 tools/test_entry_only_replay.py
          python3 tools/test_native_copy_pairs.py
          python3 tools/test_alternate_mgba_copy.py
          python3 tools/test_live_context.py
          python3 tools/test_native_manual_legality.py
          python3 tools/test_shadow_menu.py
          python3 tools/test_fresh_wild_request.py
          python3 tools/test_fresh_shadow_menu.py
          python3 tools/test_private_r13_in_rom.py
          python3 tools/test_private_r14_second_turn.py
          python3 -m py_compile tools/probe_private_r14_second_turn.py tools/verify_private_r14_second_turn.py
          cc -std=c11 -Wall -Wextra -Werror -pedantic -fsyntax-only tools/trace_second_request.c
          python3 -m py_compile tools/build_private_r13_lab.py tools/probe_private_r13_in_rom.py tools/verify_private_r13_in_rom.py
          cc -std=c11 -Wall -Wextra -Werror -pedantic -fsyntax-only tools/trace_r13_candidate.c
          python3 -m py_compile tools/probe_r12_fresh_shadow_menu.py tools/verify_fresh_shadow_menu.py
          python3 -m py_compile tools/probe_fresh_wild_constructor.py tools/probe_fresh_wild_request.py tools/verify_fresh_wild_request.py
          cc -std=c11 -Wall -Wextra -Werror -pedantic -fsyntax-only tools/stop_at_wild_ctor.c tools/wait_original_player.c
          python3 -m py_compile tools/probe_shadow_menu.py tools/verify_shadow_menu.py
          python3 -m py_compile tools/probe_native_manual_legality.py tools/verify_native_manual_legality.py
          cc -std=c11 -Wall -Wextra -Werror -pedantic -fsyntax-only tools/trace_manual_native.c
          python3 -m py_compile tools/probe_live_context.py tools/verify_live_context.py
          cc -std=c11 -Wall -Wextra -Werror -pedantic -fsyntax-only tools/alternate_mgba_trace_frames.c tools/alternate_mgba_capture_player_copy.c
          python3 -m py_compile tools/probe_alternate_mgba_copy.py tools/verify_alternate_mgba_copy.py
          python3 -m py_compile tools/probe_completed_copy.py tools/verify_native_copy_pairs.py
          python3 tools/check_source.py
          python3 tools/test_hybrid_input.py
          python3 tools/test_wild_single_lab_contract.py
          python3 tools/test_wild_single_cancel_request.py
          python3 tools/test_wild_single_fixed_proposal.py
          python3 tools/test_wild_single_dynamic_state.py
          python3 tools/test_wild_single_turn_binding.py
          python3 tools/test_wild_single_postcheck.py
          python3 tools/test_wild_single_live_buffer.py
          python3 tools/test_wild_single_action_recheck.py
          python3 tools/test_wild_single_pre_target_continuity.py
          python3 tools/test_wild_single_pre_target_pool.py
          python3 tools/test_wild_single_pre_target_foe_combat.py
          python3 tools/test_wild_single_pre_target_player_state.py
          python3 tools/test_exact_modified_autoplay.py
          python3 tools/test_second_wild_auto.py
          python3 tools/test_exact_terminal_gate.py
          python3 tools/test_exact_pp_writer.py
          python3 tools/test_exact_next_wild.py
          python3 tools/test_exact_main_callback.py
          python3 tools/test_exact_outcome_pp_edges.py
          python3 tools/test_exact_actor_epoch.py
          python3 tools/test_exact_thumb_byte_stores.py
          python3 tools/test_exact_main_battle_edge.py
          python3 tools/test_exact_joint_player_terminal.py
          python3 -m py_compile tools/verify_exact_joint_player_terminal.py
          cc -std=c11 -Wall -Wextra -Werror -pedantic -fsyntax-only tools/trace_exact_joint_player_terminal.c
          cc -std=c11 -Wall -Wextra -Werror -pedantic -O2 -o /tmp/sg-original-joint tools/test_exact_joint_player_terminal.c
          /tmp/sg-original-joint
          python3 -m py_compile tools/verify_exact_main_battle_edge.py
          cc -std=c11 -Wall -Wextra -Werror -pedantic -O2 -o /tmp/sg-main-battle-edge tools/test_exact_main_battle_edge.c
          /tmp/sg-main-battle-edge
          cc -std=c11 -Wall -Wextra -Werror -pedantic -fsyntax-only tools/trace_exact_main_battle_edge.c
          python3 -m py_compile tools/verify_exact_thumb_byte_stores.py
          cc -std=c11 -Wall -Wextra -Werror -pedantic -O2 -o /tmp/sg-original-strb tools/test_exact_thumb_byte_stores.c
          /tmp/sg-original-strb
          cc -std=c11 -Wall -Wextra -Werror -pedantic -fsyntax-only tools/trace_exact_thumb_byte_stores.c
          python3 -m py_compile tools/verify_exact_actor_epoch.py
          python3 -m py_compile tools/verify_exact_outcome_pp_edges.py
          cc -std=c11 -Wall -Wextra -Werror -pedantic -fsyntax-only tools/trace_exact_outcome_pp_edges.c
          python3 -m py_compile tools/verify_exact_main_callback.py
          cc -std=c11 -Wall -Wextra -Werror -pedantic -fsyntax-only tools/trace_exact_main_callback.c
          python3 -m py_compile tools/verify_exact_next_wild.py
          cc -std=c11 -Wall -Wextra -Werror -pedantic -fsyntax-only tools/trace_exact_next_wild_flags.c
          python3 -m py_compile tools/verify_exact_pp_writer.py
          cc -std=c11 -Wall -Wextra -Werror -pedantic -fsyntax-only tools/trace_exact_pp_writer.c
          cc -std=c11 -Wall -Wextra -Werror -pedantic -fsyntax-only tools/trace_exact_terminal_gate.c
          python3 -m py_compile tools/verify_second_wild_auto.py
          python3 -m py_compile tools/verify_exact_modified_autoplay.py tools/probe_exact_modified_autoplay.py
          cc -std=c11 -Wall -Wextra -Werror -pedantic -fsyntax-only tools/trace_exact_modified_autoplay.c
          python3 -m py_compile tools/verify_hybrid_input.py
          python3 tools/test_native_anchor_parity.py
          python3 -m py_compile tools/verify_native_anchor_parity.py
