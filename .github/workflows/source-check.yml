name: Source checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Check public boundary and C syntax
        run: |
          python3 tools/test_source_boundary.py
          python3 tools/test_build_boundary.py
          python3 tools/test_choice_protocol.py
          python3 tools/test_choice_lease.py
          python3 tools/test_copy_postloop.py
          python3 tools/test_entry_only_replay.py
          python3 tools/test_native_copy_pairs.py
          python3 tools/test_alternate_mgba_copy.py
          python3 tools/test_live_context.py
          python3 tools/test_native_manual_legality.py
          python3 tools/test_shadow_menu.py
          python3 tools/test_fresh_wild_request.py
          python3 tools/test_fresh_shadow_menu.py
          python3 -m py_compile tools/probe_r12_fresh_shadow_menu.py tools/verify_fresh_shadow_menu.py
          python3 -m py_compile tools/probe_fresh_wild_constructor.py tools/probe_fresh_wild_request.py tools/verify_fresh_wild_request.py
          cc -std=c11 -Wall -Wextra -Werror -pedantic -fsyntax-only tools/stop_at_wild_ctor.c tools/wait_original_player.c
          python3 -m py_compile tools/probe_shadow_menu.py tools/verify_shadow_menu.py
          python3 -m py_compile tools/probe_native_manual_legality.py tools/verify_native_manual_legality.py
          cc -std=c11 -Wall -Wextra -Werror -pedantic -fsyntax-only tools/trace_manual_native.c
          python3 -m py_compile tools/probe_live_context.py tools/verify_live_context.py
          cc -std=c11 -Wall -Wextra -Werror -pedantic -fsyntax-only tools/alternate_mgba_trace_frames.c tools/alternate_mgba_capture_player_copy.c
          python3 -m py_compile tools/probe_alternate_mgba_copy.py tools/verify_alternate_mgba_copy.py
          python3 -m py_compile tools/probe_completed_copy.py tools/verify_native_copy_pairs.py
          python3 tools/check_source.py
