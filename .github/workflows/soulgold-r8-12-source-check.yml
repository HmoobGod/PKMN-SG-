name: SoulGold R8-12 Human-only keypress chronology source-only
on: [push, pull_request]
permissions:
  contents: read
jobs:
  fake-only-12:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Run isolated mock regressions
        run: |
          PYTHONPATH=review/r8/12_manual_key_window python3 -m unittest discover -s review/r8/12_manual_key_window -p 'test_*.py' -v
          python3 -m py_compile review/r8/12_manual_key_window/patch12_manual_key_window.py review/r8/12_manual_key_window/test_patch12_manual_key_window.py
