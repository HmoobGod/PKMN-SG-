name: SoulGold R8-02 ChooseMove moves/currentPP/maxPP binding source-only
on: [push, pull_request]
permissions:
  contents: read
jobs:
  fake-only-02:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Run isolated mock regressions
        run: |
          PYTHONPATH=review/r8/02_choosemove_fields python3 -m unittest discover -s review/r8/02_choosemove_fields -p 'test_*.py' -v
          python3 -m py_compile review/r8/02_choosemove_fields/patch02_choosemove_fields.py review/r8/02_choosemove_fields/test_patch02_choosemove_fields.py
