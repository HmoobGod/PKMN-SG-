name: SoulGold R8-11 Manual deferral cannot be promoted source-only
on: [push, pull_request]
permissions:
  contents: read
jobs:
  fake-only-11:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Run isolated mock regressions
        run: |
          PYTHONPATH=review/r8/11_manual_defer python3 -m unittest discover -s review/r8/11_manual_defer -p 'test_*.py' -v
          python3 -m py_compile review/r8/11_manual_defer/patch11_manual_defer.py review/r8/11_manual_defer/test_patch11_manual_defer.py
