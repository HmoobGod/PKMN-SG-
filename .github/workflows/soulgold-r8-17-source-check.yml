name: SoulGold R8-17 Battle outcome and overworld stop barrier source-only
on: [push, pull_request]
permissions:
  contents: read
jobs:
  fake-only-17:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Run isolated mock regressions
        run: |
          PYTHONPATH=review/r8/17_battle_outcome python3 -m unittest discover -s review/r8/17_battle_outcome -p 'test_*.py' -v
          python3 -m py_compile review/r8/17_battle_outcome/patch17_battle_outcome.py review/r8/17_battle_outcome/test_patch17_battle_outcome.py
