name: SoulGold R8-04 Bounded exact request replay ledger source-only
on: [push, pull_request]
permissions:
  contents: read
jobs:
  fake-only-04:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Run isolated mock regressions
        run: |
          PYTHONPATH=review/r8/04_one_use_ledger python3 -m unittest discover -s review/r8/04_one_use_ledger -p 'test_*.py' -v
          python3 -m py_compile review/r8/04_one_use_ledger/patch04_one_use_ledger.py review/r8/04_one_use_ledger/test_patch04_one_use_ledger.py
