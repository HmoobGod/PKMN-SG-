name: SoulGold R8-01 Original controller command shape source-only
on: [push, pull_request]
permissions:
  contents: read
jobs:
  fake-only-01:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Run isolated mock regressions
        run: |
          PYTHONPATH=review/r8/01_command_shape python3 -m unittest discover -s review/r8/01_command_shape -p 'test_*.py' -v
          python3 -m py_compile review/r8/01_command_shape/patch01_command_shape.py review/r8/01_command_shape/test_patch01_command_shape.py
