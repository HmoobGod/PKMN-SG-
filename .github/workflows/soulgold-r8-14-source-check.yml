jobs:
  fake-only-14:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Run isolated mock regressions
        run: |
          PYTHONPATH=review/r8/14_pp_cancellation python3 -m unittest discover -s review/r8/14_pp_cancellation -p 'test_*.py' -v
